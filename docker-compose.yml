version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: siem_postgres
    environment:
      POSTGRES_USER: siem_user
      POSTGRES_PASSWORD: siem_password
      POSTGRES_DB: siem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - siem_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: siem_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - siem_network

  redis:
    image: redis:7-alpine
    container_name: siem_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - siem_network

  backend:
    build: ./backend
    container_name: siem_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://siem_user:siem_password@postgres/siem_db
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - VT_API_KEY=dummy_vt_api_key
    depends_on:
      - postgres
      - redis
      - elasticsearch
    networks:
      - siem_network

  frontend:
    build: ./frontend
    container_name: siem_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - siem_network

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:

networks:
  siem_network:
    driver: bridge
